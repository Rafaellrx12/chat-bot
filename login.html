<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Login Administrador</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      height: 100vh;
      background: #000 url('fundo.jpg') no-repeat center center fixed;
      background-size: contain;
      background-color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-box {
      background: rgba(0, 0, 0, 0.85);
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 15px #000;
      color: #fff;
      width: 320px;
      text-align: center;
    }

    .login-box img {
      max-width: 120px;
      margin-bottom: 20px;
    }

    .login-box h2 {
      margin-bottom: 20px;
    }

    .login-box input {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      border: none;
      border-radius: 5px;
    }

    .login-box button {
      background: #0f0;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      font-weight: bold;
      cursor: not-allowed;
      margin-top: 10px;
    }

    .warning {
      color: orange;
      font-size: 12px;
      margin-top: 10px;
    }

    .back-button {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      color: #fff;
      border: 1px solid #0f0;
      padding: 8px 16px;
      border-radius: 5px;
      transition: 0.3s;
    }

    .back-button:hover {
      background-color: #0f0;
      color: #000;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <img src="logo.png" alt="Logo">
    <h2>Área do Administrador</h2>
    <input type="text" placeholder="Usuário" disabled>
    <input type="password" placeholder="Senha" disabled>
    <button disabled>Entrar</button>
    <p class="warning">* Login simulado. Para login real, é necessário usar JavaScript ou PHP.</p>
    
    <!-- Botão para voltar ao catálogo -->
    <a href="index.html" class="back-button">Voltar ao Catálogo</a>
  </div>
</body>
</html>
